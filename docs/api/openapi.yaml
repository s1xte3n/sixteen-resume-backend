openapi: 3.0.3
info:
  title: Azure Cloud Resume Visitor Counter API
  version: 1.1.0
  description: |
    Canonical Phase 4 contract for the public visitor counter.
    The approved visitor operation is GET /api/visitors.
servers:
  - url: https://api.example.invalid
    description: Documentation placeholder; production hostname is deployment configuration.
paths:
  /api/visitors:
    get:
      operationId: getVisitorCount
      summary: Perform the approved visitor-count operation
      description: |
        Performs one non-idempotent visitor-counter operation and returns
        the resulting persisted count after successful commit.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Optional UUID v4 correlation identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Counter operation committed successfully.
          headers:
            X-Request-ID:
              description: UUID v4 correlation identifier.
              required: true
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitorCountResponse'
        '400':
          description: Invalid request, unsupported query, unsupported body, or invalid X-Request-ID.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Platform/runtime rate limiting.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected or internal failure.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Required dependency unavailable.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Required dependency timed out; outcome may be unknown.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security: []
      x-unsupported-method-response:
        status: 405
        code: METHOD_NOT_ALLOWED
        description: Methods other than GET are outside the operation contract and must not mutate state.
      x-requirements:
        - REQ-AZ-007
        - REQ-AZ-008
        - REQ-AZ-009
        - REQ-AZ-010
        - REQ-AZ-SEC-002
        - REQ-AZ-SEC-003
components:
  schemas:
    VisitorCountResponse:
      type: object
      additionalProperties: false
      required:
        - count
      properties:
        count:
          type: integer
          minimum: 0
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              pattern: '^[A-Z][A-Z0-9_]{2,63}$'
            message:
              type: string
              minLength: 1
              maxLength: 256
            requestId:
              type: string
              format: uuid
            details:
              type: object
              additionalProperties: false
              properties:
                timestamp:
                  type: string
                  format: date-time
x-security:
  browserToCosmos: prohibited
  productionCorsOrigin: final-approved-resume-origin
  endUserAuthentication: none
  credentialsInBrowser: prohibited
