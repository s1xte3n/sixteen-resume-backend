name: Backend Tests

on:
  push:
    branches:
      - develop
      - main
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "test/**"
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Azurite
        run: npm install --global azurite

      - name: Start Azurite
        run: |
          mkdir -p "$RUNNER_TEMP/azurite"
          azurite --silent --location "$RUNNER_TEMP/azurite" > "$RUNNER_TEMP/azurite.log" 2>&1 &
          sleep 3

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest

      - name: Run Azurite persistence tests
        env:
          RUN_AZURITE_TESTS: "true"
        run: python -m pytest tests/test_table_counter.py
